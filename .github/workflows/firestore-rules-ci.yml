name: Firestore Rules CI

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore-tests/**"
      - ".github/workflows/firestore-rules-ci.yml"
  pull_request:
    paths:
      - "firestore.rules"
      - "firestore-tests/**"
      - ".github/workflows/firestore-rules-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-tests:
    name: Firestore Emulator security tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install test dependencies
        working-directory: firestore-tests
        run: npm install --no-package-lock
      - name: Run Firestore Emulator rules tests
        working-directory: firestore-tests
        run: npm test
