name: Web Angular CI

on:
  push:
    branches: [main]
    paths:
      - "web-angular/**"
      - ".github/workflows/web-ci.yml"
      - "firestore.rules"
      - "firebase.json"
  pull_request:
    paths:
      - "web-angular/**"
      - ".github/workflows/web-ci.yml"
      - "firestore.rules"
      - "firebase.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, test, and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-angular
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web-angular/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run Angular unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: Build production bundle
        run: npm run build -- --configuration production

      - name: Upload production web bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: intelligent-app-designer-web-production
          path: web-angular/dist/intelligent-app-designer/
          if-no-files-found: error
          retention-days: 30

      - name: Capture dependency security audit
        if: always()
        run: npm audit --json > npm-audit.json || true

      - name: Summarize dependency security audit
        if: always()
        run: |
          node -e "const a=require('./npm-audit.json'); console.log('Vulnerability totals:', JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(JSON.stringify({name, severity:item.severity, direct:item.isDirect, range:item.range, fixAvailable:item.fixAvailable}));"

      - name: Enforce high and critical dependency audit gate
        if: success()
        run: |
          node -e "const a=require('./npm-audit.json'); const v=a.metadata?.vulnerabilities ?? {}; console.log('Enforced audit gate:', JSON.stringify(v)); if ((v.high ?? 0) > 0 || (v.critical ?? 0) > 0) process.exit(1);"

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: web-angular/npm-audit.json
          if-no-files-found: warn
          retention-days: 14
