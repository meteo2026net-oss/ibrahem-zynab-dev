# إعداد نشر تطبيق Angular على Netlify
# المستودع: meteo2026net-oss/ibrahem-zynab-dev

[build]
  base = "web-angular"
  command = "npm install && npm run build"
  publish = "dist/intelligent-app-designer/browser"

# توجيه SPA — كل المسارات إلى index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
