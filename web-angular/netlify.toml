# يمكن استخدام هذا الملف إذا اخترت Base directory = web-angular فقط
[build]
  command = "npm ci && npm run build -- --configuration production"
  publish = "dist/intelligent-app-designer/browser"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "24.15.0"
