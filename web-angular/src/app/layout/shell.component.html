<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">م</div>
      <span>مصمم التطبيقات الذكي</span>
    </div>
    <nav class="nav">
      <div class="nav-section">التنقل</div>
      @for (item of centers; track item.path) {
        <a class="nav-item" [routerLink]="item.path" routerLinkActive="active">
          <span class="icon">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="topbar-title">مصمم التطبيقات الذكي</div>
      <div class="topbar-actions">
        @if (store.activeProject(); as p) {
          <span class="badge badge-primary">{{ p.name }} · مرحلة {{ p.phase }}</span>
        }
        <span class="badge badge-muted">v0.1.0</span>
      </div>
    </header>
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
