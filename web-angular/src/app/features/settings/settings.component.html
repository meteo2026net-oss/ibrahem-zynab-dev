<div class="page-header">
  <div>
    <h1>الإعدادات</h1>
    <p>الحساب، المظهر، والتصدير</p>
  </div>
</div>

<div class="card" style="max-width:520px">
  <div class="card-title">الواجهة</div>
  <div class="form-group">
    <label class="form-label">الوضع (حسب المواصفات)</label>
    <select class="form-control" [(ngModel)]="uiMode">
      <option value="simple">بسيط — تركيز على الوصف والمتابعة</option>
      <option value="pro">احترافي — كل المراكز والأدوات</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">اللغة</label>
    <select class="form-control" [(ngModel)]="language">
      <option value="ar">العربية</option>
      <option value="en">English</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">المنطقة الزمنية</label>
    <select class="form-control" [(ngModel)]="timezone">
      <option>Asia/Riyadh</option>
      <option>UTC</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">الإشعارات</label>
    <label class="chk"><input type="checkbox" [(ngModel)]="notifyBuild" /> عند اكتمال البناء</label>
    <label class="chk"><input type="checkbox" [(ngModel)]="notifyRelease" /> عند النشر</label>
    <label class="chk"><input type="checkbox" [(ngModel)]="notifyComments" /> تعليقات الفريق</label>
  </div>
  <button class="btn btn-primary" type="button" (click)="save()">حفظ</button>
  @if (saved) { <span class="ok">تم</span> }
</div>

<div class="card" style="max-width:520px">
  <div class="card-title">تصدير واستعادة</div>
  <button class="btn btn-secondary" type="button" (click)="exportProject()">تصدير المشروع JSON</button>
  <button class="btn btn-secondary" type="button" style="margin-right:8px" (click)="reset()">إعادة ضبط البيانات</button>
</div>
