<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <div class="logo">م</div>
      <h1>مصمم التطبيقات الذكي</h1>
      <p>منصة تصميم وبناء التطبيقات من الفكرة حتى الإطلاق</p>
    </div>
    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label class="form-label">الاسم</label>
        <input class="form-control" [(ngModel)]="name" name="name" autocomplete="name" />
      </div>
      <div class="form-group">
        <label class="form-label">البريد الإلكتروني</label>
        <input class="form-control" type="email" [(ngModel)]="email" name="email" autocomplete="username" />
      </div>
      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <input class="form-control" type="password" [(ngModel)]="password" name="password" autocomplete="current-password" />
      </div>
      @if (error) {
        <div class="error">{{ error }}</div>
      }
      <button class="btn btn-primary btn-lg" type="submit" style="width:100%">دخول</button>
      <p class="hint">للتجربة: أي بريد وكلمة مرور غير فارغة</p>
    </form>
  </div>
</div>
