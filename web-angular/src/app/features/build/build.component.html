<div class="card">
  <div class="card-title">مركز البناء</div>
  <div class="toolbar">
    <select class="form-control" style="width:140px" [value]="platform" (change)="platform = $any($event.target).value">
      <option>Android</option>
      <option>Web</option>
      <option>iOS</option>
    </select>
    <button class="btn btn-primary" (click)="build()">توليد الكود وبناء الحزمة</button>
  </div>
  <pre class="log">@for (line of store.buildLog(); track $index) {{{ line }}&#10;}</pre>
  @if (store.lastApk(); as apk) {
    <div class="apk" [class.ready]="apk.ready">
      <div>
        <strong>{{ apk.name }}</strong>
        <div class="hint">{{ platform }} · {{ apk.size }} · {{ apk.ready ? 'جاهز' : 'قيد البناء...' }}</div>
      </div>
      <button class="btn btn-primary btn-sm" [disabled]="!apk.ready">تحميل</button>
    </div>
  }
</div>
