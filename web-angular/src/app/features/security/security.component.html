<div class="card">
  <div class="card-title">مركز الأمان — الأدوار</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>الدور</th><th>الصلاحيات</th></tr></thead>
      <tbody>
        @for (r of store.roles(); track r.role) {
          <tr><td>{{ r.role }}</td><td>{{ r.permissions }}</td></tr>
        }
      </tbody>
    </table>
  </div>
</div>
