<div class="card"><div class="card-title">{{ title }} — زر أضف للسلة</div>
<div class="grid-2">
<div>
  <h4 style="margin-bottom:10px;color:var(--primary)">محرر الإجراءات المرئي</h4>
  <div style="padding:12px;background:#f7fafc;border-radius:8px;margin-bottom:8px;border-right:3px solid var(--primary-light)"><strong>1.</strong> التحقق من تسجيل الدخول</div>
  <div style="padding:12px;background:#f7fafc;border-radius:8px;margin-bottom:8px;border-right:3px solid var(--primary-light)"><strong>2.</strong> كمية = 1</div>
  <div style="padding:12px;background:#f7fafc;border-radius:8px;margin-bottom:8px;border-right:3px solid var(--primary-light)"><strong>3.</strong> استدعاء addToCart</div>
  <div style="padding:12px;background:#f0fff4;border-radius:8px;margin-bottom:8px;border-right:3px solid var(--success)"><strong>4.</strong> رسالة نجاح + تحديث العداد</div>
  <div style="padding:12px;background:#fff5f5;border-radius:8px;margin-bottom:8px;border-right:3px solid var(--danger)"><strong>5.</strong> عرض الخطأ عند الفشل</div>
  <div class="toolbar"><button class="btn btn-secondary btn-sm">+ خطوة</button><button class="btn btn-primary btn-sm">اختبار</button><button class="btn btn-success btn-sm">حفظ</button></div>
</div>
<div>
  <h4 style="margin-bottom:10px;color:var(--primary)">اللغة الطبيعية</h4>
  <textarea class="form-control" rows="8">عندما يضغط المستخدم على أضف للسلة: إن لم يكن مسجلاً افتح تسجيل الدخول. ثم أضف المنتج بكمية 1. عند النجاح أظهر رسالة وحدّث العداد.</textarea>
  <div class="toolbar" style="margin-top:12px"><button class="btn btn-primary">تحويل إلى منطق</button></div>
</div>
</div></div>
