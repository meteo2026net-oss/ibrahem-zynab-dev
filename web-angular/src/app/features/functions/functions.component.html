<div class="page-header">
  <div>
    <h1>مركز الوظائف</h1>
    <p>اربط أزرار الواجهة بمنطق تفاعلي — مرئي أو بلغة طبيعية</p>
  </div>
</div>
<div class="card">
  <div class="card-title">مركز الوظائف — زر «أضف للسلة»</div>
  <div class="grid-2">
    <div>
      <h4 class="sub">محرر الإجراءات المرئي</h4>
      @for (s of store.functionSteps(); track s.id) {
        <div class="step" [class]="kindClass(s.kind)">
          <strong>{{ s.id }}. {{ s.title }}</strong>
          <div class="detail">{{ s.detail }}</div>
        </div>
      }
      <div class="toolbar">
        <button class="btn btn-secondary btn-sm" (click)="store.addFunctionStep()">+ خطوة</button>
        <button class="btn btn-primary btn-sm" (click)="test()">اختبار</button>
      </div>
      @if (tested) {
        <div class="test-ok">{{ testMsg }}</div>
      }
    </div>
    <div>
      <h4 class="sub">اللغة الطبيعية</h4>
      <textarea class="form-control" rows="8" [(ngModel)]="natural"></textarea>
      <div class="toolbar" style="margin-top:12px">
        <button class="btn btn-primary" (click)="convert()">تحويل إلى منطق</button>
      </div>
    </div>
  </div>
</div>
