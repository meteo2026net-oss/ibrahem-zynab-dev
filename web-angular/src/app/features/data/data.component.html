@for (entity of store.entities(); track entity.name) {
  <div class="card">
    <div class="card-title">مركز البيانات — كيان {{ entity.name }}</div>
    <div class="toolbar">
      <button class="btn btn-primary" type="button">+ كيان</button>
      <button class="btn btn-secondary" type="button">مخطط العلاقات</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>الحقل</th><th>النوع</th><th>إلزامي</th><th>فريد</th><th>ملاحظات</th></tr>
        </thead>
        <tbody>
          @for (f of entity.fields; track f.name) {
            <tr>
              <td>{{ f.name }}</td>
              <td>{{ f.type }}</td>
              <td>{{ f.required ? 'نعم' : 'لا' }}</td>
              <td>{{ f.unique ? 'نعم' : 'لا' }}</td>
              <td>{{ f.notes }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
}
