<div class="grid-3">
  <div class="stat-card"><div class="stat-value">{{ counts().done }}</div><div class="stat-label">مكتمل</div></div>
  <div class="stat-card"><div class="stat-value">{{ counts().review }}</div><div class="stat-label">بانتظار المراجعة</div></div>
  <div class="stat-card"><div class="stat-value">{{ counts().running }}</div><div class="stat-label">قيد التنفيذ</div></div>
</div>
<div class="card" style="margin-top:16px">
  <div class="card-title">مركز الوكلاء — المهام</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>المعرف</th><th>الوكيل</th><th>الوصف</th><th>الحالة</th></tr></thead>
      <tbody>
        @for (t of store.agentTasks(); track t.id) {
          <tr>
            <td>{{ t.id }}</td>
            <td>{{ t.agent }}</td>
            <td>{{ t.description }}</td>
            <td><span class="badge" [class]="cls(t.status)">{{ label(t.status) }}</span></td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
