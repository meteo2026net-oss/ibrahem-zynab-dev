<div class="grid-3" style="margin-bottom:16px">
  <div class="stat-card"><div class="stat-value">{{ store.testsSummary().pass }}</div><div class="stat-label">ناجح</div></div>
  <div class="stat-card"><div class="stat-value">{{ store.testsSummary().fail }}</div><div class="stat-label">فشل</div></div>
  <div class="stat-card"><div class="stat-value">{{ store.testsSummary().pending }}</div><div class="stat-label">معلّق</div></div>
</div>
<div class="card">
  <div class="card-title">مركز الاختبار — مسار السلة والطلب</div>
  <div class="toolbar">
    <button class="btn btn-success" (click)="store.runAllPendingTests()">تشغيل المعلّق</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>المعرف</th><th>الحالة</th><th>المتوقع</th><th>النتيجة</th><th>إجراء</th></tr></thead>
      <tbody>
        @for (t of store.tests(); track t.id) {
          <tr>
            <td>{{ t.id }}</td>
            <td>{{ t.title }}</td>
            <td>{{ t.expected }}</td>
            <td><span class="badge" [class]="cls(t.result)">{{ label(t.result) }}</span></td>
            <td>
              <button class="btn btn-sm btn-success" (click)="store.setTestResult(t.id, 'pass')">نجح</button>
              <button class="btn btn-sm btn-danger" (click)="store.setTestResult(t.id, 'fail')">فشل</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
