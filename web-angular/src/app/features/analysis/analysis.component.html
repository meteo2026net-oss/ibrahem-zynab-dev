
<div class="card">
  <div class="card-title">{{ title }} — مشروع متجري</div>
  <div class="form-group">
    <label class="form-label">وصف الفكرة</label>
    <textarea class="form-control" rows="5">أريد تطبيق متجر إلكتروني بسيط. الزبون يتصفح المنتجات حسب التصنيف، يضيف للسلة، ثم يطلب بعد تسجيل الدخول. البائع يدير المنتجات والطلبات.</textarea>
  </div>
  <div class="toolbar">
    <button class="btn btn-primary">تحليل الآن</button>
    <button class="btn btn-secondary">رفع ملف مواصفات</button>
    <button class="btn btn-secondary">حفظ كمسودة</button>
  </div>
</div>
<div class="card">
  <div class="card-title">نتائج التحليل — المتطلبات</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>المعرف</th><th>المتطلب</th><th>الأولوية</th></tr></thead>
      <tbody>
        <tr><td>R-01</td><td>تصفح قائمة المنتجات</td><td><span class="badge badge-danger">عالي</span></td></tr>
        <tr><td>R-02</td><td>إضافة منتج إلى السلة</td><td><span class="badge badge-danger">عالي</span></td></tr>
        <tr><td>R-03</td><td>إتمام الطلب بعد تسجيل الدخول</td><td><span class="badge badge-danger">عالي</span></td></tr>
        <tr><td>R-04</td><td>إدارة المنتجات من لوحة البائع</td><td><span class="badge badge-danger">عالي</span></td></tr>
        <tr><td>R-05</td><td>عرض حالة الطلب</td><td><span class="badge badge-warning">متوسط</span></td></tr>
      </tbody>
    </table>
  </div>
  <div class="toolbar" style="margin-top:12px">
    <button class="btn btn-success">اعتماد والانتقال للتصميم</button>
    <button class="btn btn-secondary">إعادة التحليل</button>
  </div>
</div>
