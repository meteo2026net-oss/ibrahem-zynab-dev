<div class="card">
  <div class="card-title">
    مركز التحليل
    @if (store.activeProject(); as p) {
      <span class="badge badge-primary" style="margin-right:8px">{{ p.name }}</span>
    }
  </div>
  <div class="form-group">
    <label class="form-label">وصف الفكرة</label>
    <textarea class="form-control" rows="5" [(ngModel)]="idea"></textarea>
  </div>
  <div class="toolbar">
    <button class="btn btn-primary" (click)="run()" [disabled]="analyzing">
      {{ analyzing ? 'جاري التحليل...' : 'تحليل الآن' }}
    </button>
    <button class="btn btn-secondary" type="button">رفع ملف مواصفات</button>
  </div>
</div>

@if (store.analysisDone()) {
  <div class="card">
    <div class="card-title">نتائج التحليل — المتطلبات</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>المعرف</th><th>المتطلب</th><th>الأولوية</th><th>الاعتماد</th></tr>
        </thead>
        <tbody>
          @for (r of store.requirements(); track r.id) {
            <tr>
              <td>{{ r.id }}</td>
              <td>{{ r.text }}</td>
              <td><span class="badge" [class]="priorityClass(r.priority)">{{ priorityLabel(r.priority) }}</span></td>
              <td>
                <button class="btn btn-sm" [class]="r.approved ? 'btn-success' : 'btn-secondary'" (click)="store.toggleRequirement(r.id)">
                  {{ r.approved ? 'معتمد' : 'اعتماد' }}
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <div class="toolbar" style="margin-top:12px">
      <button class="btn btn-success" (click)="store.approveAllRequirements()">اعتماد الكل والانتقال للتصميم</button>
      <a routerLink="/design" class="btn btn-primary">فتح التصميم</a>
      <button class="btn btn-secondary" (click)="run()">إعادة التحليل</button>
    </div>
  </div>
}
