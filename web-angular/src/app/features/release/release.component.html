<div class="card">
  <div class="card-title">مركز الإطلاق</div>
  <div class="form-group">
    <label class="form-label">الإصدار</label>
    <input class="form-control" [(ngModel)]="version" />
  </div>
  <div class="form-group">
    <label class="form-label">ملاحظات الإصدار</label>
    <textarea class="form-control" rows="3" [(ngModel)]="notes"></textarea>
  </div>
  <div class="checks">
    @for (c of store.release().checklist; track c.label) {
      <div class="check-row">
        <span>{{ c.done ? '✓' : '○' }}</span>
        <span [style.color]="c.done ? 'var(--success)' : 'var(--text-muted)'">{{ c.label }}</span>
      </div>
    }
  </div>
  @if (store.release().lastPublished) {
    <p class="hint">آخر نشر: {{ store.release().lastPublished }}</p>
  }
  <div class="toolbar">
    <button class="btn btn-secondary" (click)="save()">حفظ</button>
    <button class="btn btn-success" (click)="publish()">تأكيد النشر</button>
  </div>
  @if (message) { <p class="msg">{{ message }}</p> }
</div>
